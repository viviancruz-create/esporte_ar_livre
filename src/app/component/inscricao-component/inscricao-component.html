    <h2>Inscrição na Corrida</h2>
  
    <form (ngSubmit)="finalizarInscricao()">
      
      <!-- Linha 1: Atleta e CPF -->
      <div class="linha-form">
        <div class="campo flex-2">
          <label>Atleta Cadastrado</label>
          <select [(ngModel)]="atletaSelecionadoId" name="atletaSelecionadoId">
            <option [ngValue]="null" disabled selected>Selecione o atleta (ou digite o CPF)</option>
            <option *ngFor="let atleta of atletas" [value]="atleta.id">
              {{ atleta.nome }}
            </option>
          </select>
        </div>
  
        <div class="campo flex-1">
          <label>Ou Buscar por CPF</label>
          <input 
            type="text" 
            placeholder="000.000.000-00" 
            [(ngModel)]="cpfBusca" 
            name="cpfBusca"
            (blur)="buscarPorCpf()"
          />
        </div>
      </div>
  
      <!-- Linha 2: Corrida e Distância -->
      <div class="linha-form">
        <div class="campo flex-2">
          <label>Corrida Escolhida</label>
          <select [(ngModel)]="corridaSelecionadaId" name="corridaSelecionadaId">
            <option [ngValue]="null" disabled selected>Selecione a corrida</option>
            <option *ngFor="let corrida of corridas" [value]="corrida.id">
              {{ corrida.descricao_corrida }} ({{ corrida.data_corrida }})
            </option>
          </select>
        </div>
  
        <div class="campo flex-1">
          <label>Distância da Prova</label>
          <div class="radio-group">
            <label><input type="radio" name="distancia" value="5km" [(ngModel)]="distanciaSelecionada"> 5km</label>
            <label><input type="radio" name="distancia" value="10km" [(ngModel)]="distanciaSelecionada"> 10km</label>
            <label><input type="radio" name="distancia" value="25km" [(ngModel)]="distanciaSelecionada"> 25km</label>
          </div>
        </div>
      </div>
  
      <!-- Linha 3: Camiseta e Categoria -->
      <div class="linha-form">
        <div class="campo flex-1">
          <label>Tamanho da Camiseta (Kit)</label>
          <select [(ngModel)]="tamanhoCamiseta" name="tamanhoCamiseta">
            <option value="" disabled selected>Selecione</option>
            <option value="P">P</option>
            <option value="M">M</option>
            <option value="G">G</option>
            <option value="GG">GG</option>
          </select>
        </div>
  
        <div class="campo flex-2">
          <label>Categoria / Faixa Etária</label>
          <input type="text" [(ngModel)]="categoriaFaixaEtaria" name="categoriaFaixaEtaria" readonly class="input-disabled" />
        </div>
      </div>
  
      <!-- Banner de Valor da Inscrição -->
      <div class="box-valor">
        <span>Valor da Inscrição:</span>
        <span class="valor">{{ valorInscricao | currency:'BRL':'symbol':'1.2-2' }}</span>
      </div>
  
      <!-- Checkbox Termos -->
      <div class="campo-checkbox">
        <input type="checkbox" id="termos" [(ngModel)]="aceitoTermos" name="aceitoTermos" />
        <label for="termos">Li e aceito os termos do regulamento da prova e declaração de saúde.</label>
      </div>
  
      <!-- Botão Finalizar -->
      <button type="submit" class="btn-finalizar">
        Finalizar e Ir para Pagamento
      </button>
  
    </form>
  </div>
